<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드뉴스 - 호봉정정 처분과 채무부존재확인 소송</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #003087 0%, #0047d9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card-viewer {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #003087 0%, #0047d9 100%);
            width: 12.5%;
            transition: width 0.3s ease;
        }

        .card-content {
            min-height: 500px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-number {
            display: inline-block;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #003087 0%, #0047d9 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 32px;
            font-weight: 700;
            color: #003087;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .card-subtitle {
            font-size: 24px;
            font-weight: 700;
            color: #0047d9;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .card-text {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 20px;
        }

        .card-text strong {
            color: #003087;
            font-weight: 700;
        }

        .card-text em {
            color: #0047d9;
            font-style: normal;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .nav-button {
            padding: 12px 24px;
            border: 2px solid #003087;
            background: white;
            color: #003087;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .nav-button:hover {
            background: #003087;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 48, 135, 0.3);
        }

        .nav-button:active {
            transform: translateY(0);
        }

        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .badge-nav {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            flex: 1;
        }

        .badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0e0e0;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .badge:hover {
            background: #d0d0d0;
            transform: scale(1.1);
        }

        .badge.active {
            background: linear-gradient(135deg, #003087 0%, #0047d9 100%);
            color: white;
            border-color: #003087;
        }

        .card-counter {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .card-content {
                min-height: 450px;
                padding: 30px 20px;
            }

            .card-title {
                font-size: 28px;
            }

            .card-subtitle {
                font-size: 20px;
            }

            .card-text {
                font-size: 15px;
            }

            .controls {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .nav-button {
                width: 100%;
            }

            .badge-nav {
                width: 100%;
                order: -1;
            }
        }

        @media (max-width: 480px) {
            .card-content {
                min-height: 400px;
                padding: 25px 15px;
            }

            .card-title {
                font-size: 24px;
            }

            .card-subtitle {
                font-size: 18px;
            }

            .card-number {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .card-text {
                font-size: 14px;
                line-height: 1.6;
            }

            .badge {
                width: 36px;
                height: 36px;
                font-size: 13px;
            }

            .badge-nav {
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-viewer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="card-content" id="cardContent">
                <!-- 카드 내용이 여기에 동적으로 로드됨 -->
            </div>

            <div class="controls">
                <button class="nav-button" id="prevBtn" onclick="previousCard()">← 이전</button>
                <div class="badge-nav" id="badgeNav"></div>
                <button class="nav-button" id="nextBtn" onclick="nextCard()">다음 →</button>
            </div>
            <div class="card-counter" id="counter"></div>
        </div>
    </div>

    <script>
        const cardsData = [
            {
                title: "어느 날 갑자기",
                subtitle: "착아온 환수 통보!",
                number: 1,
                content: `
                    <p class="card-text">
                        <strong>호봉정정 처분</strong>으로 인해 과다 지급된 급여를 환수해야 하는 상황이 발생했습니다.
                    </p>
                    <p class="card-text">
                        회사가 근로자의 호봉을 잘못 산정하여 <em>더 많은 급여</em>를 지급했던 경우, 이를 바로잡기 위해 과다 지급분을 환수하게 됩니다.
                    </p>
                    <p class="card-text">
                        이런 상황에서 근로자들이 환수 통보를 받으면 당황하게 되는데, 과연 <strong>모든 금액을 반환</strong>해야 할까요?
                    </p>
                `
            },
            {
                title: "제게",
                subtitle: "그만한 빚은 없습니다!",
                number: 2,
                content: `
                    <p class="card-text">
                        근로자가 받았던 급여가 <strong>사실상 정당한 대가</strong>라고 생각할 때는 어떻게 할까요?
                    </p>
                    <p class="card-text">
                        이때 근로자는 <em>채무부존재확인 소송</em>을 제기할 수 있습니다.
                    </p>
                    <p class="card-text">
                        이는 "제게 그만한 빚은 없습니다"라는 주장으로, 회사가 청구한 환수금에 대해 <strong>법적 효력</strong>을 인정하지 않으려는 조치입니다.
                    </p>
                `
            },
            {
                title: "법원이 인정하는",
                subtitle: "\"명백하고 중대한 결함\"",
                number: 3,
                content: `
                    <p class="card-text">
                        법원은 <strong>호봉정정 처분의 정당성</strong>을 판단할 때 중요한 기준을 적용합니다.
                    </p>
                    <p class="card-text">
                        그것은 바로 <em>\"명백하고 중대한 결함\"</em>의 존재 여부입니다.
                    </p>
                    <p class="card-text">
                        만약 호봉 산정 과정에 <strong>심각한 오류</strong>가 있었다면, 법원은 이를 인정할 수 있습니다.
                    </p>
                `
            },
            {
                title: "명백하고 중대한 결함이",
                subtitle: "인정되면 어떻게?",
                number: 4,
                content: `
                    <p class="card-text">
                        법원이 호봉정정 처분에 <strong>명백하고 중대한 결함</strong>이 있다고 판단하면:
                    </p>
                    <p class="card-text">
                        1️⃣ <em>처분 자체가 무효</em>가 되어 법적 효력이 상실됩니다.
                    </p>
                    <p class="card-text">
                        2️⃣ 이미 환수한 금액에 대해서는 <strong>부당이득 반환</strong> 청구를 할 수 있습니다.
                    </p>
                    <p class="card-text">
                        즉, 근로자가 받았던 급여는 <strong>정당한 대가</strong>로 인정되는 것입니다.
                    </p>
                `
            },
            {
                title: "왜 \"지난 5년분\"만",
                subtitle: "돌려받을 수 있을까?",
                number: 5,
                content: `
                    <p class="card-text">
                        부당이득 반환 청구는 <strong>시효 제한</strong>이 있습니다.
                    </p>
                    <p class="card-text">
                        민법에 따르면 부당이득 반환 청구권의 시효는 <em>3년</em>입니다.
                    </p>
                    <p class="card-text">
                        다만, 호봉정정 처분이 <strong>지난 5년 이상 전</strong>에 이루어진 경우라면, 그 시점부터 시효가 시작됩니다.
                    </p>
                    <p class="card-text">
                        따라서 환수할 수 있는 범위는 <strong>시효 내의 기간</strong>으로 제한되게 됩니다.
                    </p>
                `
            },
            {
                title: "\"매달\" 다시 시작되는",
                subtitle: "시효 기산점",
                number: 6,
                content: `
                    <p class="card-text">
                        중요한 포인트: 호봉정정으로 인한 부당이득은 <strong>월급처럼 매달 발생</strong>합니다.
                    </p>
                    <p class="card-text">
                        이는 각 월마다 <strong>독립적인 부당이득</strong>으로 취급되므로, 시효가 <em>각각 다르게 기산</em>됩니다.
                    </p>
                    <p class="card-text">
                        예를 들어 2019년부터 2023년까지 호봉이 잘못되었다면, 각 연도의 급여가 별도로 시효 대상이 됩니다.
                    </p>
                    <p class="card-text">
                        따라서 <strong>개별 계산</strong>이 필요합니다.
                    </p>
                `
            },
            {
                title: "정리하면",
                subtitle: "이렇게 진행됩니다",
                number: 7,
                content: `
                    <p class="card-text">
                        <strong>1단계</strong>: 호봉정정 처분 통보 및 환수 요청
                    </p>
                    <p class="card-text">
                        <strong>2단계</strong>: 채무부존재확인 소송 제기
                    </p>
                    <p class="card-text">
                        <strong>3단계</strong>: 법원이 \"명백하고 중대한 결함\" 판단
                    </p>
                    <p class="card-text">
                        <strong>4단계</strong>: 판결에 따라 처분 무효 또는 시효 범위 내에서 부당이득 반환 청구
                    </p>
                `
            },
            {
                title: "결론: 급여는",
                subtitle: "정당한 대가입니다",
                number: 8,
                content: `
                    <p class="card-text">
                        호봉정정으로 인한 환수 요청을 받았다면, <strong>결함의 명백성</strong>을 법적으로 검토해야 합니다.
                    </p>
                    <p class="card-text">
                        근로자가 받았던 급여는 <em>이미 제공한 노동의 대가</em>입니다.
                    </p>
                    <p class="card-text">
                        <strong>법적 보호</strong>를 통해 정당한 권리를 지킬 수 있습니다.
                    </p>
                    <p class="card-text">
                        더 자세한 상담은 <strong>전문가</strong>와 함께 하시길 바랍니다.
                    </p>
                `
            }
        ];

        let currentCard = 0;

        function renderCard(index) {
            const card = cardsData[index];
            const cardContent = document.getElementById('cardContent');
            cardContent.innerHTML = `
                <div>
                    <div class="card-number">${card.number}</div>
                    <h2 class="card-title">${card.title}</h2>
                    <h3 class="card-subtitle">${card.subtitle}</h3>
                </div>
                <div>
                    ${card.content}
                </div>
            `;

            // 진행바 업데이트
            const progress = ((index + 1) / cardsData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // 배지 업데이트
            document.querySelectorAll('.badge').forEach((badge, i) => {
                if (i === index) {
                    badge.classList.add('active');
                } else {
                    badge.classList.remove('active');
                }
            });

            // 카운터 업데이트
            document.getElementById('counter').textContent = `${index + 1} / ${cardsData.length}`;

            // 버튼 상태 업데이트
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === cardsData.length - 1;

            currentCard = index;
        }

        function nextCard() {
            if (currentCard < cardsData.length - 1) {
                renderCard(currentCard + 1);
            }
        }

        function previousCard() {
            if (currentCard > 0) {
                renderCard(currentCard - 1);
            }
        }

        function jumpToCard(index) {
            renderCard(index);
        }

        function initBadges() {
            const badgeNav = document.getElementById('badgeNav');
            cardsData.forEach((card, index) => {
                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.textContent = card.number;
                badge.onclick = () => jumpToCard(index);
                badgeNav.appendChild(badge);
            });
        }

        // 키보드 네비게이션
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === 'ArrowRight') nextCard();
        });

        // 초기화
        window.addEventListener('DOMContentLoaded', () => {
            initBadges();
            renderCard(0);
        });
    </script>
</body>
</html>
